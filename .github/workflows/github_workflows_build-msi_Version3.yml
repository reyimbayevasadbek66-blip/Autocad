name: Build MSI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install WiX via choco
        run: choco install wixtoolset --no-progress -y

      - name: Build MSI
        run: |
          set PATH=%PATH%;C:\Program Files (x86)\WiX Toolset v3.11\bin
          candle.exe AsadbekTools.wxs
          light.exe -out AsadbekTools.msi AsadbekTools.wixobj

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: AsadbekTools-msi
          path: AsadbekTools.msi